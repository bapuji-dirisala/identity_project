[tool.poetry]
name = "identity_project"
version = "0.0.0"
description = "Member identity data product"
authors = ["Data Engineering <data-engineering@example.com>"]
readme = "README.md"
packages = [{ include = "src", from = "spark/python" }]

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

# Replace with your enterprise Artifactory for internal packages
#[[tool.poetry.source]]
#name = "internal"
#url = "https://<ARTIFACTORY_URL>/api/pypi/python-local/simple"
#priority = "supplemental"

[tool.poetry.dependencies]
python = ">=3.10.12,<3.12"
brickflows = "^1.7.2"
pyyaml = "^6.0"
pyspark = "3.5.4"
delta-spark = "3.2.0"
# Internal data-platform helper used by the real project. Keep as reference.
# pycaasio = {version = "^1.2.7", source = "internal"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
black = "^24.0"
mypy = "^1.10"

[tool.coverage.run]
omit = ["tests/*", "venv/*"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
disallow_untyped_defs = false
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
